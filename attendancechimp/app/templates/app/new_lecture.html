<!-- {% load static %} -->

<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Attendance Chimp</title>
    <link rel="stylesheet" href="{% static 'app/css/styles.css' %}">
</head>
<html>
    <h1>New Lecture</h1>

    <!-- Optional: shows errors if login fails -->
    {{ form.errors }}


    <body class="center">
        <form class="form" method="POST" action="{% url 'createLecture' %}">
            
            <label>Course Name </label>
            <input type="text" name="choice">

            <label>Date </label>
            <input type="date" name="date">
             
            <button type="submit" value="submit">Submit</button>

        </form>
        
    </body>
</html>
