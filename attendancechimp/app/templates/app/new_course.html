{% load static %}

<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Attendance Chimp</title>
    <link rel="stylesheet" href="{% static 'app/css/styles.css' %}">
</head>
<html>
    <h1>New Course</h1>

    <!-- Optional: shows errors if login fails -->
    {{ form.errors }}


    <body class="center">
        <form class="form" method="POST" action="{% url 'createCourse' %}">
            
            <label>Course Name </label>
            <input type="text" name="course-name">
            
            <label>Start time </label>
            <input type="time" name="start-time">

            <label>End time </label>
            <input type="time" name="end-time">

            <fieldset>
                <legend>Days of Week</legend>
                <input type="checkbox" name="day-mon">Mon</input>
                <input type="checkbox" name="day-tue">Tue</input>
                <input type="checkbox" name="day-wed">Wed</input>
                <input type="checkbox" name="day-thu">Thu</input>
                <input type="checkbox" name="day-fri">Fri</input>
            </fieldset>
             
            <button type="submit" value="submit">Submit</button>

        </form>
        
    </body>
</html>
